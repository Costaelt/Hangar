<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Hangar 41</title>
<meta name="description" content="Cardápio do Hangar 41 Bar e Restaurante – Aeroporto de Jundiaí.">
<meta name="theme-color" content="#0c0c0a">
<!--
  CARDÁPIO HANGAR 41 — COMO EDITAR
  ---------------------------------
  1) Abra este arquivo no navegador com "?editar" no fim do endereço
     (ex.: cardapio.html?editar) ou clique em "Área do restaurante" no rodapé.
  2) Clique em qualquer nome, descrição ou preço para alterar. Use os botões
     para adicionar, mover, ocultar ou excluir itens e para incluir fotos.
  3) As alterações ficam salvas no navegador. Para publicar, clique em
     "Baixar cardápio atualizado" e substitua este arquivo pelo baixado.
  Também é possível editar direto o bloco JSON "dados-cardapio" abaixo.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0c0a;
    --surface:#151512;
    --surface-2:#1d1d19;
    --cream:#f4f0d4;
    --text:#e9e5cb;
    --muted:#a19e88;
    --line:rgba(244,240,212,.13);
    --olive:#55611f;
    --olive-2:#76852f;
    --accent:#d3dc7c;
    --danger:#e8775f;
    --radius:14px;
    --display:'Anton',Impact,'Arial Narrow',sans-serif;
    --body:'PT Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scroll-padding-top:68px;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4,p{margin:0}
  a{color:inherit}
  button{font:inherit;color:inherit}

  /* ---------- Capa ---------- */
  .hero{position:relative;overflow:hidden;padding:72px 16px 64px;text-align:center;
    background:radial-gradient(120% 90% at 50% 0%,#1d1e15 0%,var(--bg) 70%)}
  .hero::before,.hero::after{content:"";position:absolute;pointer-events:none}
  .hero::before{top:0;right:0;width:min(42vw,300px);aspect-ratio:1;
    background:linear-gradient(225deg,var(--olive) 0 22%,var(--cream) 22% 30%,transparent 30%);opacity:.9}
  .hero::after{bottom:0;left:0;width:min(42vw,300px);aspect-ratio:1;
    background:linear-gradient(45deg,var(--olive) 0 22%,var(--cream) 22% 30%,transparent 30%);opacity:.9}
  .hero-inner{position:relative;z-index:1;max-width:640px;margin:0 auto}
  .marca{font-size:.82rem;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .marca .sep{opacity:.5;margin:0 .35em}
  .hero-titulo{font-family:var(--display);font-weight:400;color:var(--cream);font-size:clamp(3.2rem,15vw,6.4rem);line-height:.95;margin:14px 0 18px;text-transform:uppercase;letter-spacing:.01em}
  .hero-slogan{color:var(--text);font-size:1.05rem;max-width:30em;margin:0 auto;white-space:pre-line}
  .hero-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:28px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);
    text-decoration:none;font-size:.9rem;font-weight:700;color:var(--cream);background:rgba(244,240,212,.04)}
  .pill:hover{border-color:var(--accent)}
  .pill svg{width:16px;height:16px}

  /* ---------- Navegação ---------- */
  .nav{position:sticky;top:0;z-index:20;background:rgba(12,12,10,.88);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .nav-inner{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:1000px;margin:0 auto}
  .nav-inner::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;font-size:.88rem;font-weight:700;padding:8px 14px;border-radius:999px;color:var(--muted);white-space:nowrap;transition:background .2s,color .2s}
  .nav a:hover{color:var(--cream)}
  .nav a.ativo{background:var(--cream);color:var(--bg)}

  /* ---------- Seções ---------- */
  main{max-width:1000px;margin:0 auto;padding:0 16px}
  .secao{padding:56px 0 20px}
  .secao + .secao{border-top:1px solid var(--line)}
  .secao-head{margin-bottom:24px}
  .etapa{display:block;font-size:.74rem;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
  .secao-titulo{font-family:var(--display);font-weight:400;font-size:clamp(2.5rem,10vw,3.8rem);line-height:1;color:var(--cream);letter-spacing:.01em}
  .secao-sub{font-style:italic;color:var(--muted);font-size:1.05rem;margin-top:4px}
  .secao-horario{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:.88rem;color:var(--cream)}
  .secao-horario svg{width:15px;height:15px;flex:none;color:var(--accent)}

  .grupos{display:grid;gap:40px}
  @media (min-width:760px){
    .grupos{grid-template-columns:1fr 1fr;column-gap:56px}
    .grupo.largo{grid-column:1/-1}
  }
  .grupo-head{margin-bottom:6px}
  .grupo-titulo{font-family:var(--display);font-weight:400;font-size:1.55rem;color:var(--cream);letter-spacing:.02em;line-height:1.15}
  .grupo-nota{font-size:.85rem;color:var(--muted);margin-top:2px}

  /* ---------- Itens ---------- */
  .itens{display:grid}
  .item{display:flex;flex-wrap:wrap;align-items:flex-start;gap:4px 14px;padding:13px 0;border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:0}
  .item-corpo{flex:1;min-width:0}
  .item-linha{display:flex;align-items:baseline;gap:8px}
  .item-nome{font-weight:700;font-size:1.12rem;color:var(--cream);line-height:1.25}
  .leader{flex:1;min-width:14px;border-bottom:2px dotted rgba(244,240,212,.22);transform:translateY(-4px)}
  .preco{font-style:italic;font-weight:700;color:var(--accent);white-space:nowrap;font-size:1.12rem}
  .preco .rs{font-size:.78em;margin-right:2px}
  .preco.texto .rs{display:none}
  .item-desc{font-size:.95rem;color:var(--muted);margin-top:3px;white-space:pre-line;line-height:1.4}

  /* grupos com fotos: cartões */
  .com-foto .itens{gap:12px}
  @media (min-width:760px){ .com-foto .itens{grid-template-columns:1fr 1fr;gap:14px 16px} }
  .com-foto .item{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:14px;align-items:center}
  .com-foto .item:last-child{border-bottom:1px solid var(--line)}

  /* grupos com mais de um preço (chopp) */
  .colunas{display:flex;justify-content:flex-end;gap:6px;padding:4px 0 6px;border-bottom:1px solid var(--line)}
  .colunas span{width:76px;text-align:center;font-size:.7rem;line-height:1.2;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .item-precos{display:flex;gap:6px;align-self:center}
  .item-precos .col{width:76px;text-align:center}

  /* caixa promocional (happy hour) */
  .grupo-promo{background:linear-gradient(140deg,var(--olive) 0%,#3d4716 100%);border-radius:var(--radius);padding:20px 18px 8px}
  .grupo-promo .grupo-titulo{font-size:2rem}
  .grupo-promo .grupo-nota{color:var(--cream);opacity:.85}
  .grupo-promo .item{border-color:rgba(244,240,212,.2)}
  .grupo-promo .item-desc{color:rgba(244,240,212,.75)}
  .grupo-promo .preco{color:var(--cream)}
  .grupo-promo .leader{border-color:rgba(244,240,212,.35)}

  /* destaque (prato especial) */
  .destaque{display:grid;gap:0;border-radius:var(--radius);overflow:hidden;background:linear-gradient(140deg,#1f2a3a 0%,#161d28 100%);border:1px solid rgba(244,240,212,.12)}
  @media (min-width:760px){ .destaque{grid-template-columns:1.1fr 1fr} }
  .destaque-corpo{padding:22px 20px 24px;display:flex;flex-direction:column;gap:10px;justify-content:center}
  .selo{align-self:flex-start;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--bg);background:var(--accent);padding:4px 10px;border-radius:999px}
  .destaque-nome{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.02;color:var(--cream);text-transform:uppercase}
  .destaque .item-desc{font-size:.98rem;color:#cfd3dc}
  .destaque .preco{font-size:1.8rem}

  /* ---------- Espaços para fotos ---------- */
  .foto{position:relative;margin:0;overflow:hidden;background:var(--surface-2);border-radius:var(--radius)}
  .foto img{display:block;width:100%;height:100%;object-fit:cover}
  /* fotos com bordas que se dissolvem no fundo (em vez de retângulo reto) */
  .foto-quadro{position:absolute;inset:0;overflow:hidden;display:block}
  .foto.tem{background:transparent;border-radius:0}
  .foto.banner.tem .foto-quadro{
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 42%,rgba(0,0,0,.6) 70%,transparent 100%);
    mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 42%,rgba(0,0,0,.6) 70%,transparent 100%)}
  .destaque-foto.tem .foto-quadro,.panoramico .foto.tem .foto-quadro{
    -webkit-mask-image:linear-gradient(to bottom,#000 50%,transparent 100%);mask-image:linear-gradient(to bottom,#000 50%,transparent 100%)}
  @media (min-width:760px){
    .destaque-foto.tem .foto-quadro,.panoramico .foto.tem .foto-quadro{
      -webkit-mask-image:linear-gradient(to right,#000 45%,transparent 100%);mask-image:linear-gradient(to right,#000 45%,transparent 100%)}
  }
  /* foto do produto como fundo do cartão, transparecendo atrás do texto */
  .item.com-fundo{position:relative;overflow:hidden;min-height:104px}
  .foto.item-fundo{position:absolute;top:0;right:0;bottom:0;width:62%;margin:0;z-index:0;pointer-events:none;opacity:.9}
  .foto.item-fundo .foto-quadro{
    -webkit-mask-image:radial-gradient(ellipse 95% 120% at 85% 50%,#000 25%,rgba(0,0,0,.5) 60%,transparent 100%);
    mask-image:radial-gradient(ellipse 95% 120% at 85% 50%,#000 25%,rgba(0,0,0,.5) 60%,transparent 100%)}
  .item.com-fundo > :not(.item-fundo){position:relative;z-index:1}
  .item.com-fundo .item-nome,.item.com-fundo .preco,.item.com-fundo .item-desc{text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 10px rgba(0,0,0,.6)}
  .item.com-fundo .item-desc{color:#cfccb4}
  .item.com-fundo .leader{border-color:rgba(244,240,212,.35)}
  .foto.vazia{border:1.5px dashed rgba(244,240,212,.22);
    background:repeating-linear-gradient(135deg,rgba(244,240,212,.025) 0 12px,transparent 12px 24px),var(--surface-2)}
  .foto-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:rgba(244,240,212,.38);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:8px}
  .foto-ph svg{width:28px;height:28px}
  .foto.banner{width:100%;aspect-ratio:16/7;max-height:300px;margin-bottom:28px}
  .foto.thumb{flex:none;width:92px;height:92px;border-radius:10px}
  .foto.thumb .foto-ph em{display:none}
  .foto.thumb .foto-ph svg{width:24px;height:24px}
  .foto.destaque-foto{border-radius:0;min-height:220px;aspect-ratio:4/3}
  .foto.destaque-foto.vazia{border:0;border-right:1.5px dashed rgba(244,240,212,.18)}
  .foto-ph em{font-style:normal}

  /* ---------- Informações ---------- */
  .info-grid{display:grid;gap:16px}
  @media (min-width:760px){ .info-grid{grid-template-columns:1fr 1fr} }
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
  .card h3{font-family:var(--display);font-weight:400;font-size:1.45rem;color:var(--cream);margin-bottom:10px;letter-spacing:.02em}
  .card dl{margin:0;display:grid;gap:12px}
  .card dt{font-weight:700;color:var(--cream);font-size:.95rem}
  .card dd{margin:2px 0 0;color:var(--muted);font-size:.92rem;white-space:pre-line}
  .panoramico{margin-top:16px;display:grid;gap:16px;padding:0;overflow:hidden}
  @media (min-width:760px){ .panoramico{grid-template-columns:1fr 1fr;align-items:center} }
  .panoramico .foto{border-radius:0;aspect-ratio:16/10;margin:0}
  .panoramico .foto.vazia{border:0}
  .panoramico-corpo{padding:4px 20px 22px}
  @media (min-width:760px){ .panoramico-corpo{padding:22px 22px 22px 4px} }
  .panoramico-corpo p{color:var(--text);white-space:pre-line}
  .contato{text-align:center;padding:44px 0 8px;display:grid;gap:16px;justify-items:center}
  .contato .satisfacao{max-width:36em;color:var(--text);white-space:pre-line}
  .contato .endereco{font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--cream);font-size:.92rem}
  .contato-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  footer.rodape{text-align:center;padding:32px 16px 40px;color:var(--muted);font-size:.78rem;letter-spacing:.04em;max-width:1000px;margin:0 auto}
  footer.rodape .assinatura{font-family:var(--display);font-size:1.4rem;color:var(--cream);letter-spacing:.04em;margin-bottom:10px;text-transform:uppercase}
  footer.rodape a.editar-link{display:inline-block;margin-top:18px;color:rgba(244,240,212,.28);text-decoration:none;font-size:.72rem}
  footer.rodape a.editar-link:hover{color:var(--muted)}

  /* ---------- Modo edição ---------- */
  .ctrl{display:none}
  .modo-edicao .ctrl{display:flex}
  .modo-edicao body,body.modo-edicao{padding-bottom:150px}
  body.modo-edicao .ed{outline:1px dashed rgba(211,220,124,.35);outline-offset:2px;border-radius:3px;cursor:text;min-width:1.5em;display:inline-block}
  body.modo-edicao p.ed,body.modo-edicao h1.ed,body.modo-edicao h2.ed,body.modo-edicao h3.ed{display:block}
  body.modo-edicao .ed:hover{outline-color:rgba(211,220,124,.7)}
  body.modo-edicao .ed:focus{outline:2px solid var(--accent);background:rgba(211,220,124,.07)}
  body.modo-edicao .ed:empty::before{content:attr(data-ph);color:rgba(244,240,212,.3);font-style:italic;font-weight:400}
  body.modo-edicao .ctrl{display:flex}
  body.modo-edicao .is-oculto{opacity:.38}
  body.modo-edicao .foto[data-acao]{cursor:pointer}
  body.modo-edicao .foto[data-acao]:hover{outline:2px solid var(--accent)}
  body.modo-edicao.preview .ctrl{display:none}
  body.modo-edicao.preview .ed{outline:0;background:none}
  body.modo-edicao.preview .ed:empty{display:none}
  body.modo-edicao.preview .is-oculto{display:none}

  .item-ctrl{flex-basis:100%;gap:4px;flex-wrap:wrap;padding-top:6px}
  .grupo-ctrl{gap:10px;align-items:center;margin-top:8px;font-size:.82rem;color:var(--muted)}
  .grupo-ctrl label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
  .cat-ctrl{flex-wrap:wrap;gap:4px;align-items:center;margin-bottom:8px;padding:6px 8px;border-radius:9px;background:rgba(211,220,124,.06);border:1px solid rgba(211,220,124,.18)}
  .cat-ctrl .rotulo{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-right:auto;padding-right:6px}
  .secao-ctrl{margin-top:14px}
  .btn-add-cat{margin-top:22px}
  body.modo-edicao .grupo.is-oculto,body.modo-edicao .secao.is-oculto .secao-head,body.modo-edicao .secao.is-oculto .grupos{opacity:.38}
  body.modo-edicao.preview .grupo.is-oculto,body.modo-edicao.preview .secao.is-oculto{display:none}
  .mini{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:3px 9px;font-size:.78rem;cursor:pointer;color:var(--text)}
  .mini:hover{border-color:var(--accent)}
  .mini.perigo:hover{border-color:var(--danger);color:var(--danger)}
  .btn-add{margin-top:10px;width:100%;justify-content:center;border:1.5px dashed rgba(211,220,124,.45);background:transparent;color:var(--accent);border-radius:10px;padding:10px;font-weight:700;cursor:pointer}
  .btn-add:hover{background:rgba(211,220,124,.07)}
  .foto-ctrl{position:absolute;left:8px;bottom:8px;gap:6px;z-index:2}
  .foto-ctrl .mini{background:rgba(12,12,10,.85)}

  /* editor de enquadramento (zoom/posição) das fotos */
  .ajuste-modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
  .ajuste-caixa{background:#1b1c16;border:1px solid var(--olive-2);border-radius:16px;padding:18px;max-width:100%;max-height:100%;overflow:auto;display:grid;gap:12px;justify-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .ajuste-caixa h3{font-family:var(--display);font-weight:400;font-size:1.5rem;color:var(--cream);justify-self:start;letter-spacing:.02em}
  .ajuste-dica{font-size:.85rem;color:var(--muted);justify-self:start;max-width:62ch}
  .ajuste-quadro{position:relative;overflow:hidden;border-radius:10px;background:#000;cursor:grab;touch-action:none;outline:2px solid var(--accent);outline-offset:2px;flex:none}
  .ajuste-quadro.arrastando{cursor:grabbing}
  .ajuste-quadro img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-select:none;pointer-events:none}
  .ajuste-quadro::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px)),
               linear-gradient(180deg,transparent calc(33.33% - .5px),rgba(255,255,255,.28) calc(33.33% - .5px) calc(33.33% + .5px),transparent calc(33.33% + .5px) calc(66.66% - .5px),rgba(255,255,255,.28) calc(66.66% - .5px) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
  .ajuste-zoom{display:flex;align-items:center;gap:10px;width:100%;max-width:440px;color:var(--cream);font-weight:700}
  .ajuste-zoom input{flex:1;accent-color:var(--accent)}
  .ajuste-zoom button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1.1rem;line-height:1}
  .ajuste-zoom output{min-width:48px;text-align:right;font-size:.85rem;color:var(--muted)}
  .ajuste-botoes{display:flex;gap:8px;width:100%;flex-wrap:wrap;align-items:center}
  .ajuste-botoes .espaco{flex:1}

  .ajuda{max-width:1000px;margin:16px auto 0;padding:0 16px}
  .ajuda-box{background:#232617;border:1px solid var(--olive-2);border-radius:var(--radius);padding:14px 16px;font-size:.9rem;color:var(--cream)}
  .ajuda-box strong{color:var(--accent)}
  .ajuda-box ol{margin:6px 0 0;padding-left:20px}
  .ajuda-box li{margin:2px 0}
  body.preview .ajuda{display:none}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#1b1c16;border-top:1px solid var(--olive-2);box-shadow:0 -10px 30px rgba(0,0,0,.45);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .barra-inner{max-width:1000px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center}
  .barra-info{flex:1 1 220px;min-width:0;font-size:.82rem;color:var(--muted);line-height:1.3}
  .barra-info strong{display:block;color:var(--cream);font-size:.92rem}
  .barra-info .pendente{color:var(--accent)}
  .barra label{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;color:var(--text);cursor:pointer}
  .btn{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:8px 13px;font-size:.86rem;font-weight:700;cursor:pointer}
  .btn:hover{border-color:var(--accent)}
  .btn.primario{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .btn.primario:hover{filter:brightness(1.07)}
  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:60;background:var(--cream);color:var(--bg);font-weight:700;font-size:.9rem;padding:10px 16px;border-radius:10px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

  .print-bar{display:none}
  body.modo-impressao .print-bar{display:flex}
  .print-bar{position:fixed;top:0;left:0;right:0;z-index:55;background:#1b1c16;border-bottom:1px solid var(--olive-2);padding:10px 16px;gap:8px 12px;flex-wrap:wrap;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .print-bar strong{color:var(--cream);font-size:.92rem;margin-right:auto}
  .print-bar label{font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
  .print-bar select{font:inherit;font-size:.85rem;background:var(--surface-2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
  .print-dica{flex-basis:100%;text-align:center;font-size:.76rem;color:var(--muted)}

  .folhas{--fi:1.15;display:flex;flex-direction:column;align-items:center;gap:26px;
    --p-bg:#0c0c0a;--p-text:#e9e5cb;--p-cream:#f4f0d4;--p-muted:#a9a690;--p-accent:#d3dc7c;
    --p-line:rgba(244,240,212,.18);--p-line2:rgba(244,240,212,.32);--p-surface:#181815;
    --p-olive:#55611f;--p-olive-text:#f8f6e6;--p-tri:#f4f0d4;
    --p-dest:#1c2533;--p-dest-text:#f4f0d4;--p-dest-muted:#c6cbd4}
  .folhas.claro{
    --p-bg:#ffffff;--p-text:#2a2a26;--p-cream:#141412;--p-muted:#66655a;--p-accent:#4b5814;
    --p-line:rgba(0,0,0,.14);--p-line2:rgba(0,0,0,.3);--p-surface:#f3f2ea;
    --p-olive:#55611f;--p-olive-text:#ffffff;--p-tri:#d9d5b6;
    --p-dest:#eef1f5;--p-dest-text:#14202f;--p-dest-muted:#4a5462}
  .folha{--esc:1;position:relative;width:210mm;height:297mm;overflow:hidden;flex:none;background:var(--p-bg);color:var(--p-text);
    box-shadow:0 10px 34px rgba(0,0,0,.55);font-family:var(--body);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .folha-in{position:absolute;inset:0;z-index:2;padding:14mm 14mm 17mm;display:flex;flex-direction:column;overflow:hidden;line-height:1.35;font-size:calc(10.5pt * var(--esc))}
  .folha.estourou{outline:4px solid var(--danger)}
  .folha.estourou::after{content:"⚠ O conteúdo desta página não coube inteiro. Reduza descrições, mova itens ou remova a foto.";position:absolute;left:0;right:0;top:0;z-index:5;background:var(--danger);color:#fff;font:700 12px var(--body);padding:6px 10px;text-align:center}

  .f-head{margin-bottom:calc(5mm * var(--esc))}
  .f-etapa{display:block;font-size:calc(7.5pt * var(--esc));letter-spacing:.3em;text-transform:uppercase;color:var(--p-accent);font-weight:700}
  .f-titulo{font-family:var(--display);font-weight:400;font-size:calc(40pt * var(--esc));line-height:1;color:var(--p-cream);margin-top:1mm;letter-spacing:.01em}
  .f-sub{font-style:italic;color:var(--p-muted);font-size:calc(11pt * var(--esc));margin-top:.8mm}
  .f-horario{display:inline-flex;align-items:center;gap:2mm;margin-top:2.6mm;padding:1.1mm 3.4mm;border:1px solid var(--p-line2);border-radius:99px;font-size:calc(8.5pt * var(--esc));color:var(--p-cream)}
  .f-horario svg{width:3.4mm;height:3.4mm;flex:none;color:var(--p-accent)}

  .f-grupos{display:flex;flex-direction:column;gap:7mm}
  .f-grupo{min-width:0}
  .f-grupo.largo{grid-column:1/-1}
  .f-grupo-titulo{font-family:var(--display);font-weight:400;font-size:calc(17pt * var(--esc) * var(--fi));color:var(--p-cream);letter-spacing:.02em;line-height:1.15;padding-bottom:1.2mm;border-bottom:1px solid var(--p-line);margin-bottom:.8mm}
  .f-grupo-nota{font-size:calc(9.5pt * var(--esc) * var(--fi));color:var(--p-muted);margin:0 0 1mm}
  .f-lista-2 .f-itens{columns:2;column-gap:10mm}
  .f-item{display:flex;gap:2.5mm;align-items:center;padding:calc(2.4mm * var(--fi)) 0;break-inside:avoid;border-bottom:1px solid var(--p-line)}
  .f-cont-tag{font-family:var(--body);font-size:7.5pt;letter-spacing:.18em;text-transform:uppercase;color:var(--p-muted);vertical-align:middle;margin-left:2mm}
  .f-head-cont{margin-bottom:5mm}
  .f-titulo-cont{font-size:22pt}
  /* cartões com foto ao fundo, como no cardápio digital */
  .f-com-foto .f-itens{display:grid;grid-template-columns:1fr 1fr;gap:3mm;margin-top:1.5mm}
  .f-card{border:1px solid var(--p-line);border-radius:3mm;background:var(--p-surface);padding:calc(3.4mm * var(--fi)) 3.8mm;position:relative;overflow:hidden;min-height:calc(17mm * var(--fi))}
  .f-card.com-fundo{min-height:calc(24mm * var(--fi))}
  .f-card .f-fundo{position:absolute;top:0;bottom:0;right:0;width:62%;overflow:hidden;z-index:0;opacity:.92}
  .f-card .f-fundo .f-quadro{
    -webkit-mask-image:radial-gradient(ellipse 95% 120% at 85% 50%,#000 25%,rgba(0,0,0,.5) 60%,transparent 100%);
    mask-image:radial-gradient(ellipse 95% 120% at 85% 50%,#000 25%,rgba(0,0,0,.5) 60%,transparent 100%)}
  .f-card .f-fundo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .f-card.com-fundo > :not(.f-fundo){position:relative;z-index:1}
  .f-card.com-fundo .f-nome,.f-card.com-fundo .preco,.f-card.com-fundo .f-desc{text-shadow:0 0 3px var(--p-bg),0 0 8px var(--p-bg)}
  .f-corpo{flex:1;min-width:0}
  .f-linha{display:flex;align-items:baseline;gap:1.5mm}
  .f-nome{font-weight:700;color:var(--p-cream);font-size:calc(11.5pt * var(--esc) * var(--fi));line-height:1.22}
  .f-leader{flex:1;min-width:3mm;border-bottom:1.3px dotted var(--p-line2);transform:translateY(-.9mm)}
  .folha .preco{color:var(--p-accent);font-size:calc(11.5pt * var(--esc) * var(--fi))}
  .f-desc{font-size:calc(9.4pt * var(--esc) * var(--fi));color:var(--p-muted);line-height:1.3;margin-top:.3mm;white-space:pre-line}
  .f-thumb{position:relative;overflow:hidden;width:calc(15mm * var(--esc));height:calc(15mm * var(--esc));border-radius:1.6mm;flex:none}
  .f-thumb img{display:block;width:100%;height:100%;object-fit:cover}
  .f-colunas{display:flex;justify-content:flex-end;gap:2mm;padding-bottom:.6mm}
  .f-colunas span,.f-col{width:calc(17mm * var(--esc) * var(--fi));text-align:center}
  .f-colunas span{font-size:calc(7pt * var(--esc) * var(--fi));font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--p-muted);line-height:1.2}
  .f-precos{display:flex;gap:2mm;align-self:center}

  .f-promo{background:var(--p-olive);color:var(--p-olive-text);border-radius:3mm;padding:4mm 5mm 3mm}
  .f-promo .f-grupo-titulo{font-size:calc(19pt * var(--esc) * var(--fi));border-color:rgba(255,255,255,.25)}
  .f-promo .f-grupo-titulo,.f-promo .f-nome,.f-promo .preco{color:var(--p-olive-text)}
  .f-promo .f-desc,.f-promo .f-grupo-nota{color:rgba(255,255,255,.8)}
  .f-promo .f-leader{border-color:rgba(255,255,255,.45)}

  .f-destaque{display:grid;grid-template-columns:1fr 1fr;border-radius:3mm;overflow:hidden;background:var(--p-dest);min-height:calc(56mm * var(--esc))}

  .f-dest-corpo{padding:5mm 5.5mm;display:flex;flex-direction:column;gap:2mm;justify-content:center}

  .f-dest-desc{font-size:calc(9.6pt * var(--esc) * var(--fi));color:var(--p-dest-muted);white-space:pre-line}

  .f-quadro{position:absolute;inset:0;overflow:hidden;display:block}

  .f-banner.f-fim.tem .f-quadro{
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.55) 22%,#000 48%);

    -webkit-mask-image:linear-gradient(to right,#000 45%,transparent 100%);mask-image:linear-gradient(to right,#000 45%,transparent 100%)}
  .f-capa-foto .f-quadro{border-radius:50%}
  .f-pe{text-shadow:0 0 4px var(--p-bg)}
  .f-foto.vazia{border:1.3px dashed var(--p-line2);background:repeating-linear-gradient(135deg,rgba(128,128,110,.08) 0 3mm,transparent 3mm 6mm),var(--p-surface)}

  .f-banner{flex:1 1 0;min-height:48mm;margin-top:calc(6mm * var(--esc))}
  .f-dest-foto{border-radius:0;min-height:100%}
  .f-dest-foto.vazia{border:0;border-right:1.3px dashed var(--p-line2)}

  .f-pe{position:absolute;left:14mm;right:14mm;bottom:6.5mm;z-index:3;display:flex;justify-content:space-between;font-size:6.5pt;letter-spacing:.24em;text-transform:uppercase;color:var(--p-muted)}

  /* capa */
  .f-capa::before,.f-capa::after{content:"";position:absolute;width:78mm;height:78mm;z-index:1}
  .f-capa::before{top:0;right:0;background:linear-gradient(225deg,var(--p-olive) 0 22%,var(--p-tri) 22% 30%,transparent 30%)}
  .f-capa::after{bottom:0;left:0;background:linear-gradient(45deg,var(--p-olive) 0 22%,var(--p-tri) 22% 30%,transparent 30%)}
  .f-capa .folha-in{align-items:center;justify-content:center;text-align:center;gap:9mm}
  .capa-marca{font-size:12pt;letter-spacing:.42em;text-transform:uppercase;color:var(--p-accent);font-weight:700}
  .capa-titulo{font-family:var(--display);font-weight:400;font-size:74pt;line-height:.95;color:var(--p-cream);text-transform:uppercase;margin-top:3mm}
  .capa-comp{font-size:10pt;letter-spacing:.38em;text-transform:uppercase;color:var(--p-muted);margin-top:4mm}
  .f-capa-foto{width:80mm;height:80mm;border-radius:50%;flex:none}

  /* boas-vindas / informações */
  .bv-in{text-align:center}
  .bv-titulo{font-size:calc(44pt * var(--esc))}
  .bv-slogan{max-width:150mm;margin:4mm auto 0;font-size:calc(12pt * var(--esc));color:var(--p-text);white-space:pre-line}
  .bv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:calc(11mm * var(--esc));text-align:left}
  .f-dl{margin:2mm 0 0;display:grid;gap:calc(3mm * var(--esc))}
  .f-dl dt{font-weight:700;color:var(--p-cream);font-size:calc(10.5pt * var(--esc))}
  .f-dl dd{margin:.5mm 0 0;color:var(--p-muted);font-size:calc(9.5pt * var(--esc));white-space:pre-line}
  .f-texto{font-size:calc(11.5pt * var(--esc));white-space:pre-line;max-width:165mm;color:var(--p-text)}
  .f-contato{text-align:center;margin-top:calc(7mm * var(--esc));display:grid;gap:2.6mm}
  .f-satisf{font-size:calc(10pt * var(--esc));color:var(--p-text);white-space:pre-line;max-width:150mm;margin:0 auto}
  .f-end{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-cream);font-size:calc(10pt * var(--esc))}
  .f-wa{font-weight:700;color:var(--p-accent);font-size:calc(11.5pt * var(--esc));letter-spacing:.1em}
  .f-fine{font-size:calc(7pt * var(--esc));color:var(--p-muted);letter-spacing:.04em;margin-top:2mm}

  @page{size:A4 portrait;margin:0}
  @media print{
    html,body{background:#fff!important;margin:0!important;padding:0!important}
    #app,.barra,.ajuda,.toast,.print-bar{display:none!important}
    #print{position:static!important;visibility:visible!important;padding:0!important;background:none!important}
    .folhas{display:block!important;zoom:1!important;gap:0!important}
    .folha{box-shadow:none!important;outline:0!important;height:296.8mm;break-after:page;page-break-after:always}
    .folha:last-child{break-after:auto;page-break-after:auto}
    .folha.estourou::after{display:none}
    .f-foto.vazia{border-color:transparent!important;background:none!important}
    .f-foto.vazia .foto-ph{display:none}
    .folha .ed{outline:0!important;background:none!important}
  }
</style>
</head>

<script>
(function(){
  'use strict';

  /* ---------- Estado ---------- */
  var FONTE = document.getElementById('dados-cardapio').textContent;
  var ORIGINAL = JSON.parse(FONTE);
  var BASE = hash(FONTE);
  var LS_KEY = 'hangar41-cardapio-rascunho';
  var editando = /[?&]editar\b/.test(location.search) || location.hash === '#editar';
  var data = clonar(ORIGINAL);
  if (editando) {
    var rasc = lerRascunho();
    if (rasc && rasc.data) {
      if (rasc.base === BASE) data = rasc.data;
      else if (JSON.stringify(rasc.data) !== JSON.stringify(ORIGINAL) &&
               confirm('Encontramos alterações do cardápio salvas neste navegador' +
                 (rasc.em ? ' em ' + new Date(rasc.em).toLocaleString('pt-BR') : '') +
                 ', feitas em outra versão do arquivo.\n\nOK = continuar com essas alterações\nCancelar = usar o conteúdo deste arquivo')) {
        data = rasc.data;
      } else {
        // guarda uma cópia de segurança antes que o rascunho seja substituído
        try { localStorage.setItem(LS_KEY + '-anterior', JSON.stringify(rasc)); } catch(e){}
      }
    }
  }
  data.config = data.config || { mostrarEspacosFoto: true };
  var observer = null;
  var alvoFoto = null;

  /* ---------- Ícones ---------- */
  var ICON = {
    cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>',
    clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    zap: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.5-.6-2.7-1.2-4.4-3.9-4.5-4.1-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.7 1.1 1.4 1.8 1 .9 1.8 1.1 2.1 1.3.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>',
    pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>'
  };

  /* ---------- Utilidades ---------- */
  function clonar(o){ return JSON.parse(JSON.stringify(o)); }
  function hash(s){ var h = 5381; for (var i = 0; i < s.length; i++) { h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return String(h >>> 0); }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function getPath(p){ return p.split('.').reduce(function(o,k){ return o == null ? undefined : o[k]; }, data); }
  function setPath(p, v){
    var ks = p.split('.'), o = data;
    for (var i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i+1]) ? [] : {};
      o = o[ks[i]];
    }
    o[ks[ks.length-1]] = v;
  }
  function pai(p){ var i = p.lastIndexOf('.'); return { lista: p.slice(0, i), idx: +p.slice(i+1) }; }
  function isNum(v){ return /^\d+([.,]\d{1,2})?$/.test(String(v == null ? '' : v).trim()); }
  function normPreco(s){
    s = String(s).replace(/R\$\s*/i, '').trim();
    if (isNum(s)) return String(parseFloat(s.replace(',', '.')));
    return s;
  }
  function fmtPreco(v){
    if (v == null || v === '') return '';
    if (!isNum(v)) return String(v);
    var n = parseFloat(String(v).replace(',', '.'));
    return n % 1 === 0 ? String(n) : n.toFixed(2).replace('.', ',');
  }
  function lerRascunho(){ try { var s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; } catch(e){ return null; } }

  /* ---------- Blocos de renderização ---------- */
  function ed(path, tag, cls, tipo, ph){
    tipo = tipo || 'texto';
    var v = getPath(path);
    var mostrado = tipo === 'preco' ? fmtPreco(v) : (v == null ? '' : v);
    return '<' + tag + ' class="ed ' + (cls || '') + '" data-path="' + path + '" data-tipo="' + tipo + '"' +
      (ph ? ' data-ph="' + esc(ph) + '"' : '') + (editando ? ' contenteditable="true" spellcheck="true"' : '') + '>' +
      esc(mostrado) + '</' + tag + '>';
  }
  function opt(path, tag, cls, tipo, ph){
    var v = getPath(path);
    if (!editando && (v == null || v === '')) return '';
    return ed(path, tag, cls, tipo, ph);
  }
  function preco(path, vazio){
    var v = getPath(path);
    if (!editando && (v == null || v === '')) return vazio ? '<span class="preco">—</span>' : '';
    var texto = v !== '' && v != null && !isNum(v);
    return '<span class="preco' + (texto ? ' texto' : '') + '"><span class="rs">R$</span>' + ed(path, 'span', 'preco-valor', 'preco', '0') + '</span>';
  }
  /* Enquadramento salvo de cada foto: { x, y } = ponto de foco em %, z = zoom (1 a 4).
     Fica guardado ao lado da foto, com o sufixo "Ajuste" (ex.: "foto" -> "fotoAjuste"). */
  function ajusteDe(path){
    var a = getPath(path + 'Ajuste');
    if (!a || typeof a !== 'object') return null;
    return { x: isFinite(+a.x) ? +a.x : 50, y: isFinite(+a.y) ? +a.y : 50, z: isFinite(+a.z) && +a.z >= 1 ? +a.z : 1 };
  }
  function cssAjuste(a){
    return 'object-position:' + a.x + '% ' + a.y + '%;transform-origin:' + a.x + '% ' + a.y + '%;transform:scale(' + a.z + ')';
  }
  function estiloImg(path){ var a = ajusteDe(path); return a ? ' style="' + cssAjuste(a) + '"' : ''; }
  function limparAjuste(path){
    var i = path.lastIndexOf('.'), dono = getPath(path.slice(0, i));
    if (dono && typeof dono === 'object') delete dono[path.slice(i + 1) + 'Ajuste'];
  }

  function slotFoto(path, cls, alt){
    var src = getPath(path);
    if (!src && !editando && !data.config.mostrarEspacosFoto) return '';
    var vazio = !src;
    if (vazio && editando && !data.config.mostrarEspacosFoto) cls += ' some-no-preview';
    return '<figure class="foto ' + cls + (vazio ? ' vazia' : ' tem') + '"' +
      (editando ? (vazio ? ' data-acao="foto-up" data-path="' + path + '" title="Clique para escolher uma foto"'
                         : ' data-acao="foto-ajustar" data-path="' + path + '" title="Clique para ajustar zoom e enquadramento"') : '') + '>' +
      (vazio ? '<span class="foto-ph">' + ICON.cam + '<em>' + (editando ? 'adicionar foto' : 'foto em breve') + '</em></span>'
             : '<span class="foto-quadro"><img src="' + esc(src) + '" alt="' + esc(alt || '') + '" loading="lazy"' + estiloImg(path) + '></span>') +
      (editando && cls.indexOf('thumb') === -1 ?
        '<div class="ctrl foto-ctrl">' + (vazio ? '' : '<button type="button" class="mini" data-acao="foto-ajustar" data-path="' + path + '">Zoom / enquadrar</button>') +
        '<button type="button" class="mini" data-acao="foto-up" data-path="' + path + '">' + (vazio ? 'Enviar foto' : 'Trocar foto') + '</button>' +
        '<button type="button" class="mini" data-acao="foto-link" data-path="' + path + '">Usar link</button>' +
        (vazio ? '' : '<button type="button" class="mini perigo" data-acao="foto-del" data-path="' + path + '">Remover</button>') + '</div>' : '') +
      '</figure>';
  }
  function ctrlItem(ip, comFoto, temFoto, oculto){
    return '<div class="ctrl item-ctrl">' +
      '<button type="button" class="mini" data-acao="up" data-path="' + ip + '" title="Mover para cima">↑</button>' +
      '<button type="button" class="mini" data-acao="down" data-path="' + ip + '" title="Mover para baixo">↓</button>' +
      '<button type="button" class="mini" data-acao="ocultar" data-path="' + ip + '">' + (oculto ? 'Mostrar no cardápio' : 'Ocultar (em falta)') + '</button>' +
      (comFoto ? (temFoto ? '<button type="button" class="mini" data-acao="foto-ajustar" data-path="' + ip + '.foto">Zoom / enquadrar</button>' : '') +
                 '<button type="button" class="mini" data-acao="foto-up" data-path="' + ip + '.foto">' + (temFoto ? 'Trocar foto' : 'Enviar foto') + '</button>' +
                 '<button type="button" class="mini" data-acao="foto-link" data-path="' + ip + '.foto">Link da foto</button>' +
                 (temFoto ? '<button type="button" class="mini perigo" data-acao="foto-del" data-path="' + ip + '.foto">Remover foto</button>' : '') : '') +
      '<button type="button" class="mini perigo" data-acao="del" data-path="' + ip + '">Excluir</button>' +
      '</div>';
  }

  function renderItem(it, ip, g){
    var multi = Array.isArray(g.colunas) && g.colunas.length > 0;
    var fundo = g.comFoto && it.foto;
    var html = '<article class="item' + (it.oculto ? ' is-oculto' : '') + (fundo ? ' com-fundo' : '') + '">';
    if (fundo) html += '<figure class="foto item-fundo tem" data-path="' + ip + '.foto" aria-hidden="true"><span class="foto-quadro">' +
      '<img src="' + esc(it.foto) + '" alt="" loading="lazy"' + estiloImg(ip + '.foto') + '></span></figure>';
    html += '<div class="item-corpo"><div class="item-linha">' + ed(ip + '.nome', 'h4', 'item-nome', 'texto', 'Nome do item');
    if (!multi) html += '<span class="leader" aria-hidden="true"></span>' + preco(ip + '.preco');
    html += '</div>' + opt(ip + '.desc', 'p', 'item-desc', 'multi', 'Descrição (opcional)') + '</div>';
    if (multi) {
      html += '<div class="item-precos">' + g.colunas.map(function(c, ci){
        return '<span class="col" title="' + esc(c) + '">' + preco(ip + '.precos.' + ci, true) + '</span>';
      }).join('') + '</div>';
    }
    if (editando) html += ctrlItem(ip, !!g.comFoto, !!it.foto, !!it.oculto);
    return html + '</article>';
  }

  function renderDestaque(it, ip, gp){
    return '<article class="destaque' + (it.oculto ? ' is-oculto' : '') + '">' +
      slotFoto(ip + '.foto', 'destaque-foto', it.nome) +
      '<div class="destaque-corpo">' +
        ed(gp + '.titulo', 'span', 'selo', 'texto', 'Selo') +
        ed(ip + '.nome', 'h3', 'destaque-nome', 'texto', 'Nome do prato') +
        opt(ip + '.desc', 'p', 'item-desc', 'multi', 'Descrição') +
        preco(ip + '.preco') +
        (editando ? ctrlItem(ip, false, false, !!it.oculto) : '') +
      '</div></article>';
  }

  // Botões para mover, ocultar ou excluir uma categoria (grupo) ou uma seção inteira.
  function ctrlCategoria(path, nivel, oculto){
    var nomeNivel = nivel === 'secao' ? 'seção' : 'categoria';
    return '<div class="ctrl cat-ctrl' + (nivel === 'secao' ? ' secao-ctrl' : '') + '">' +
      '<span class="rotulo">' + (nivel === 'secao' ? 'Seção' : 'Categoria') + (oculto ? ' · oculta' : '') + '</span>' +
      '<button type="button" class="mini" data-acao="up" data-path="' + path + '" title="Mover ' + nomeNivel + ' para cima">↑</button>' +
      '<button type="button" class="mini" data-acao="down" data-path="' + path + '" title="Mover ' + nomeNivel + ' para baixo">↓</button>' +
      '<button type="button" class="mini" data-acao="ocultar-cat" data-path="' + path + '">' + (oculto ? 'Mostrar ' + nomeNivel : 'Ocultar ' + nomeNivel) + '</button>' +
      '<button type="button" class="mini perigo" data-acao="del-cat" data-path="' + path + '">Excluir ' + nomeNivel + '</button>' +
      '</div>';
  }

  function renderGrupo(g, gp){
    var tipo = g.tipo || 'lista';
    var largo = g.comFoto || g.largo || tipo === 'destaque';
    var visiveis = g.itens.map(function(it, k){ return { it: it, k: k }; }).filter(function(x){ return editando || !x.it.oculto; });
    if (!editando && (g.oculto || !visiveis.length)) return '';
    var html = '<div class="grupo grupo-' + tipo + (g.comFoto ? ' com-foto' : '') + (largo ? ' largo' : '') + (g.oculto ? ' is-oculto' : '') + '">';
    if (editando) html += ctrlCategoria(gp, 'grupo', g.oculto);
    if (tipo === 'destaque') {
      html += visiveis.map(function(x){ return renderDestaque(x.it, gp + '.itens.' + x.k, gp); }).join('');
    } else {
      html += '<div class="grupo-head">' + opt(gp + '.titulo', 'h3', 'grupo-titulo', 'texto', 'Título do grupo') +
              opt(gp + '.nota', 'p', 'grupo-nota', 'texto', 'Observação do grupo (opcional)');
      if (editando) {
        html += '<div class="ctrl grupo-ctrl"><label><input type="checkbox" data-acao="fotos-grupo" data-path="' + gp + '"' + (g.comFoto ? ' checked' : '') + '> Espaço para foto em cada item</label></div>';
      }
      html += '</div>';
      if (Array.isArray(g.colunas) && g.colunas.length) {
        html += '<div class="colunas" aria-hidden="true">' + g.colunas.map(function(c, ci){ return ed(gp + '.colunas.' + ci, 'span', '', 'texto', 'Coluna'); }).join('') + '</div>';
      }
      html += '<div class="itens">' + visiveis.map(function(x){ return renderItem(x.it, gp + '.itens.' + x.k, g); }).join('') + '</div>';
    }
    if (editando) html += '<button type="button" class="ctrl btn-add" data-acao="add" data-path="' + gp + '">+ Adicionar item</button>';
    return html + '</div>';
  }

  function numeroEtapa(i){
    var n = 0;
    for (var k = 0; k <= i; k++) if (!data.secoes[k].oculto) n++;

  }
  function renderSecao(s, i){
    if (s.oculto && !editando) return '';

        '<span class="etapa">' + (s.oculto ? 'Seção oculta' : 'Etapa ' + numeroEtapa(i)) + '</span>' +
        ed(p + '.titulo', 'h2', 'secao-titulo', 'texto', 'Título') +
        opt(p + '.subtitulo', 'p', 'secao-sub', 'texto', 'Subtítulo (opcional)') +
        (editando || hor ? '<p class="secao-horario">' + ICON.clock + ed(p + '.horario', 'span', '', 'texto', 'Horário (opcional)') + '</p>' : '') +
      (editando ? ctrlCategoria(p, 'secao', s.oculto) : '') +

      slotFoto(p + '.foto', 'banner', s.titulo) +

      '</section>';

      return '<div>' + ed(base + '.' + k + '.rotulo', 'dt', '', 'texto', 'Rótulo') + ed(base + '.' + k + '.valor', 'dd', '', 'multi', 'Horário') + '</div>';
    }).join('');

  function mapaLink(){ return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent((data.info.endereco || '') + ', ' + (data.info.cidade || '')); }

        '<div class="card"><h3>Funcionamento</h3><dl>' + linhas(info.horarios || [], 'info.horarios') + '</dl></div>' +

      '<div class="card panoramico">' + slotFoto('info.panoramico.foto', 'panoramico-foto', info.panoramico && info.panoramico.titulo) +
        '<div class="panoramico-corpo">' + ed('info.panoramico.titulo', 'h3', '', 'texto', 'Título') + ed('info.panoramico.texto', 'p', '', 'multi', 'Texto') + '</div></div>' +
      '<div class="contato">' +

  /* ---------- Navegação ativa ---------- */
  function observarNav(){
    if (observer) observer.disconnect();
    if (!('IntersectionObserver' in window)) return;
    var nav = document.querySelector('.nav-inner');
    var links = {};
    nav.querySelectorAll('a').forEach(function(a){ links[a.getAttribute('href').slice(1)] = a; });
    observer = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (!e.isIntersecting) return;
        var a = links[e.target.id];
        if (!a) return;
        nav.querySelectorAll('a.ativo').forEach(function(x){ x.classList.remove('ativo'); });
        a.classList.add('ativo');
        nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
      });
    }, { rootMargin: '-40% 0px -55% 0px' });
    document.querySelectorAll('main .secao').forEach(function(s){ observer.observe(s); });
  }

  /* ================= VERSÃO PARA IMPRESSÃO (A4) ================= */
  function optP(path, tag, cls, tipo){
    var v = getPath(path);
    return (v == null || v === '') ? '' : ed(path, tag, cls, tipo);
  }
  function pSlot(path, cls, alt){
    var src = getPath(path);
    if (!src && !data.config.mostrarEspacosFoto) return '';
    return '<figure class="f-foto ' + cls + (src ? ' tem' : ' vazia') + '"' +
      (editando ? (src ? ' data-acao="foto-ajustar" data-path="' + path + '" title="Clique para ajustar zoom e enquadramento"'
                       : ' data-acao="foto-up" data-path="' + path + '" title="Clique para escolher uma foto"') : '') + '>' +
      (src ? '<span class="f-quadro"><img src="' + esc(src) + '" alt="' + esc(alt || '') + '"' + estiloImg(path) + '></span>'
           : '<span class="foto-ph">' + ICON.cam + '<em>espaço para foto</em></span>') +
      '</figure>';
  }
  function pe(n){ return '<footer class="f-pe"><span>' + esc(data.info.marca) + '</span><span>' + n + '</span></footer>'; }

  // Item na impressão: igual ao cardápio digital (cartão com a foto ao fundo nos grupos com foto,
  // linha com pontilhado até o preço nos demais).
  function pItem(it, ip, g){
    var multi = Array.isArray(g.colunas) && g.colunas.length > 0;
    var card = !!g.comFoto, foto = card && it.foto;
    var h = '<div class="f-item' + (card ? ' f-card' : '') + (foto ? ' com-fundo' : '') + '">';
    if (foto) h += '<span class="f-fundo" aria-hidden="true"><span class="f-quadro"><img src="' + esc(it.foto) + '" alt=""' + estiloImg(ip + '.foto') + '></span></span>';
    h += '<div class="f-corpo"><div class="f-linha">' + ed(ip + '.nome', 'span', 'f-nome');
    if (!multi) h += '<span class="f-leader"></span>' + preco(ip + '.preco');
    h += '</div>' + optP(ip + '.desc', 'div', 'f-desc', 'multi') + '</div>';
    if (multi) h += '<div class="f-precos">' + g.colunas.map(function(c, ci){ return '<span class="f-col">' + preco(ip + '.precos.' + ci, true) + '</span>'; }).join('') + '</div>';
    return h + '</div>';
  }

  function pDestaque(it, ip, gp){
    var foto = pSlot(ip + '.foto', 'f-dest-foto', it.nome);
    return '<div class="f-destaque' + (foto ? '' : ' sem-foto') + '">' + foto + '<div class="f-dest-corpo">' +
      optP(gp + '.titulo', 'span', 'f-selo') + ed(ip + '.nome', 'h3', 'f-dest-nome') +
      optP(ip + '.desc', 'p', 'f-dest-desc', 'multi') + preco(ip + '.preco') + '</div></div>';
  }

  // Cabeçalho do grupo (título, observação, nomes das colunas de preço).
  function pCabecaGrupo(g, gp, continuacao){
    var multi = Array.isArray(g.colunas) && g.colunas.length > 0;
    var titulo = getPath(gp + '.titulo');
    return (titulo ? (continuacao ? '<h3 class="f-grupo-titulo">' + esc(titulo) + ' <span class="f-cont-tag">continuação</span></h3>'
                                  : ed(gp + '.titulo', 'h3', 'f-grupo-titulo')) : '') +
      (continuacao ? '' : optP(gp + '.nota', 'p', 'f-grupo-nota')) +
      (multi ? '<div class="f-colunas">' + g.colunas.map(function(c, ci){ return ed(gp + '.colunas.' + ci, 'span', ''); }).join('') + '</div>' : '');
  }
  function classeGrupo(g){
    var multi = Array.isArray(g.colunas) && g.colunas.length > 0;
    return 'f-grupo f-' + (g.tipo || 'lista') + (g.comFoto ? ' f-com-foto' : (multi ? ' f-multi' : ' f-lista-2'));
  }

  function pLinhas(lista, base){
    return lista.map(function(h, k){ return '<div>' + ed(base + '.' + k + '.rotulo', 'dt', '') + ed(base + '.' + k + '.valor', 'dd', '', 'multi') + '</div>'; }).join('');
  }

  /* ---------- Paginação: cada seção começa numa folha nova e continua nas seguintes ---------- */
  function cabe(inn){ return inn.scrollHeight <= inn.clientHeight + 1; }
  function novaFolha(cont, extra){
    var f = document.createElement('section');
    f.className = 'folha' + (extra ? ' ' + extra : '');
    f.innerHTML = '<div class="folha-in"></div>';
    cont.appendChild(f);
    return f.querySelector('.folha-in');
  }
  function addHTML(pai, html){
    var t = document.createElement('div');
    t.innerHTML = html;
    var el = t.firstElementChild;
    pai.appendChild(el);
    return el;
  }

  function paginarSecao(cont, s, i){
    var p = 'secoes.' + i, hor = getPath(p + '.horario');
    var etapa = numeroEtapa(i);
    var inn = novaFolha(cont);
    addHTML(inn, '<header class="f-head"><span class="f-etapa">Etapa ' + etapa + '</span>' +
      ed(p + '.titulo', 'h2', 'f-titulo') + optP(p + '.subtitulo', 'p', 'f-sub') +
      (hor ? '<p class="f-horario">' + ICON.clock + ed(p + '.horario', 'span', '') + '</p>' : '') + '</header>');
    var area = addHTML(inn, '<div class="f-grupos"></div>');

    function continuar(){
      inn = novaFolha(cont);
      addHTML(inn, '<header class="f-head f-head-cont"><span class="f-etapa">Etapa ' + etapa + ' · continuação</span>' +
        '<h2 class="f-titulo f-titulo-cont">' + esc(s.titulo) + '</h2></header>');
      area = addHTML(inn, '<div class="f-grupos"></div>');
    }

    s.grupos.forEach(function(g, j){
      if (g.oculto) return;
      var gp = p + '.grupos.' + j;
      var itens = g.itens.map(function(it, k){ return { it: it, k: k }; }).filter(function(x){ return !x.it.oculto; });
      if (!itens.length) return;

      if ((g.tipo || 'lista') === 'destaque') {
        itens.forEach(function(x){
          var html = '<div class="f-grupo">' + pDestaque(x.it, gp + '.itens.' + x.k, gp) + '</div>';
          var el = addHTML(area, html);
          if (!cabe(inn)) { el.remove(); continuar(); addHTML(area, html); }
        });
        return;
      }

      var grupo = addHTML(area, '<div class="' + classeGrupo(g) + '">' + pCabecaGrupo(g, gp, false) + '<div class="f-itens"></div></div>');
      var lista = grupo.querySelector('.f-itens');
      itens.forEach(function(x){
        var html = pItem(x.it, gp + '.itens.' + x.k, g);
        var el = addHTML(lista, html);
        if (cabe(inn)) return;
        el.remove();
        if (!lista.children.length) {
          // nem o primeiro item coube: leva o grupo inteiro para a próxima folha
          grupo.remove();
          continuar();
          grupo = addHTML(area, '<div class="' + classeGrupo(g) + '">' + pCabecaGrupo(g, gp, false) + '<div class="f-itens"></div></div>');
        } else {
          continuar();
          grupo = addHTML(area, '<div class="' + classeGrupo(g) + '">' + pCabecaGrupo(g, gp, true) + '<div class="f-itens"></div></div>');
        }
        lista = grupo.querySelector('.f-itens');
        addHTML(lista, html);
      });
    });

    // Foto grande da seção: ocupa o espaço que sobrar no fim da última folha da seção.
    var banner = pSlot(p + '.foto', 'f-banner f-fim', s.titulo);
    if (banner) {
      var b = addHTML(inn, banner);
      if (!cabe(inn)) {
        b.remove();
        // sem espaço: se houver foto de verdade, ela ganha meia folha própria em seguida
        if (getPath(p + '.foto')) { continuar(); addHTML(inn, banner); }
      }
    }
  }

  // Tamanho da letra dos itens na impressão: média, grande (padrão) ou extra grande.
  var LETRAS = { media: 1, grande: 1.15, extra: 1.3 };
  function letraImpressao(){ return LETRAS[data.config.letraImpressao] || LETRAS.grande; }

  function renderPrint(){
    var info = data.info;
    var alvo = document.getElementById('print');
    alvo.innerHTML = '<div class="folhas' + (data.config.temaImpressao === 'claro' ? ' claro' : '') + '" style="--fi:' + letraImpressao() + '"></div>';
    var cont = alvo.firstElementChild;
    ajustarZoom();

    // 1. Capa
    addHTML(cont, '<section class="folha f-capa f-fixa"><div class="folha-in">' +
      '<div><p class="capa-marca">' + ed('info.marca', 'span', '') + '</p>' + ed('info.titulo', 'h1', 'capa-titulo') +
      '<p class="capa-comp">' + ed('info.complemento', 'span', '') + '</p></div>' +
      pSlot('info.capaFoto', 'f-capa-foto', 'Logo ' + info.marca) + '</div></section>');
    // 2. Boas-vindas e horários
    addHTML(cont, '<section class="folha f-fixa"><div class="folha-in bv-in">' +
      '<span class="f-etapa">Bem-vindo ao</span>' + ed('info.marca', 'h2', 'f-titulo bv-titulo') +
      optP('info.slogan', 'p', 'bv-slogan', 'multi') +
      '<div class="bv-grid"><div><h3 class="f-grupo-titulo">Horário de funcionamento</h3><dl class="f-dl">' + pLinhas(info.horarios || [], 'info.horarios') + '</dl></div>' +
      '<div><h3 class="f-grupo-titulo">Serviços</h3><dl class="f-dl">' + pLinhas(info.servicos || [], 'info.servicos') + '</dl></div></div>' +
      pSlot('info.boasVindasFoto', 'f-banner f-fim', info.marca) + '</div></section>');
    // 3. Seções do cardápio (quantas folhas forem necessárias)
    data.secoes.forEach(function(s, i){ if (!s.oculto) paginarSecao(cont, s, i); });
    // 4. Voo panorâmico e contato
    addHTML(cont, '<section class="folha f-fixa"><div class="folha-in">' +
      '<header class="f-head"><span class="f-etapa">Eleve sua experiência</span>' + ed('info.panoramico.titulo', 'h2', 'f-titulo') + '</header>' +
      optP('info.panoramico.texto', 'p', 'f-texto', 'multi') +
      pSlot('info.panoramico.foto', 'f-banner', 'Voo panorâmico') +
      '<div class="f-contato">' + optP('info.satisfacao', 'p', 'f-satisf', 'multi') +
        '<p class="f-end">' + ed('info.endereco', 'span', '') + ' · ' + ed('info.cidade', 'span', '') + '</p>' +
        '<p class="f-wa">WhatsApp ' + ed('info.whatsapp', 'span', '') + '</p>' +
        optP('info.rodape', 'p', 'f-fine', 'multi') + '</div>' +
      '</div></section>');

    // numeração das páginas (a capa não leva número)
    cont.querySelectorAll('.folha').forEach(function(f, k){
      if (k > 0) f.insertAdjacentHTML('beforeend', pe(k + 1));
    });
    ajustarFolhas();
    var tot = document.getElementById('print-total');
    if (tot) tot.textContent = cont.children.length + ' folhas A4';
  }

  // Só as folhas fixas (capa, boas-vindas, contato) ajustam o tamanho da letra para preencher a página.
  function ajustarFolhas(){
    document.querySelectorAll('#print .folha.f-fixa').forEach(function(f){
      var inn = f.querySelector('.folha-in'), e = f.classList.contains('f-capa') ? 1 : 1.25;
      f.style.setProperty('--esc', e);
      f.classList.remove('estourou');
      while (inn.scrollHeight > inn.clientHeight + 1 && e > 0.62) {
        e = Math.round((e - 0.03) * 100) / 100;
        f.style.setProperty('--esc', e);
      }
      if (inn.scrollHeight > inn.clientHeight + 1) f.classList.add('estourou');
    });
  }
  function ajustarZoom(){
    var fs = document.querySelector('#print .folhas');
    if (!fs) return;
    var larguraA4 = 210 * 96 / 25.4;
    fs.style.zoom = document.body.classList.contains('modo-impressao') ? String(Math.min(1, (window.innerWidth - 20) / larguraA4)) : '';
  }
  function modoImpressao(on){
    document.body.classList.toggle('modo-impressao', on);
    document.getElementById('print').setAttribute('aria-hidden', on ? 'false' : 'true');
    renderPrint();
    window.scrollTo({ top: 0, behavior: 'instant' });
    var b = document.getElementById('btn-versao-impressa');
    if (b) b.textContent = on ? 'Ver cardápio digital' : 'Versão para impressão';
  }
  function iniciarImpressao(){
    var bar = document.createElement('div');
    bar.className = 'print-bar efemero';
    bar.innerHTML = '<strong>Versão para impressão · <span id="print-total">folhas A4</span></strong>' +
      '<label>Fundo <select id="sel-tema"><option value="escuro">Escuro (como o atual)</option><option value="claro">Claro (economiza tinta)</option></select></label>' +
      '<label>Letra dos itens <select id="sel-letra"><option value="media">Média</option><option value="grande">Grande</option><option value="extra">Extra grande</option></select></label>' +
      '<button type="button" class="btn primario" id="btn-imprimir">Imprimir / Salvar PDF</button>' +
      '<button type="button" class="btn" id="btn-voltar">Voltar ao cardápio digital</button>' +
      '<span class="print-dica">Na janela de impressão: papel A4, margens “Nenhuma”, escala 100% e marque “Gráficos de plano de fundo”.</span>';
    document.body.insertBefore(bar, document.body.firstChild);
    var sel = document.getElementById('sel-tema');
    sel.value = data.config.temaImpressao === 'claro' ? 'claro' : 'escuro';
    var selL = document.getElementById('sel-letra');
    selL.value = LETRAS[data.config.letraImpressao] ? data.config.letraImpressao : 'grande';
    selL.addEventListener('change', function(){
      data.config.letraImpressao = selL.value;
      if (editando) salvar();
      renderPrint();
    });
    sel.addEventListener('change', function(){
      data.config.temaImpressao = sel.value;
      if (editando) salvar();
      renderPrint();
    });
    document.getElementById('btn-imprimir').addEventListener('click', function(){ window.print(); });
    document.getElementById('btn-voltar').addEventListener('click', function(){ modoImpressao(false); });
    window.addEventListener('resize', ajustarZoom);
    window.addEventListener('beforeprint', renderPrint);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPrint);
    window.addEventListener('load', renderPrint);
  }

  /* ================= MODO EDIÇÃO ================= */
  function salvar(){
    var pendente = JSON.stringify(data) !== JSON.stringify(ORIGINAL);
    try {
      if (pendente) localStorage.setItem(LS_KEY, JSON.stringify({ base: BASE, data: data, em: Date.now() }));
      else localStorage.removeItem(LS_KEY);
    } catch(e) {
      toast('O navegador ficou sem espaço para salvar (fotos grandes). Baixe o cardápio atualizado para não perder as alterações.', 6000);
    }
    var st = document.getElementById('status');
    if (st) st.innerHTML = pendente
      ? '<span class="pendente">Há alterações não publicadas.</span> Salvas neste navegador — clique em “Baixar cardápio atualizado” para publicar.'
      : 'Nenhuma alteração em relação ao arquivo publicado.';
  }

  var toastTimer;
  function toast(msg, ms){
    var t = document.getElementById('toast');
    if (!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('on'); }, ms || 2600);
  }

  function commit(el){
    var path = el.dataset.path, tipo = el.dataset.tipo;
    var v = el.innerText.replace(/ /g, ' ');
    v = tipo === 'multi' ? v.replace(/\n{3,}/g, '\n\n').trim() : v.replace(/\s*\n\s*/g, ' ').trim();
    if (tipo === 'preco') {
      v = normPreco(v);
      el.textContent = fmtPreco(v);
      var pr = el.closest('.preco'); if (pr) pr.classList.toggle('texto', v !== '' && !isNum(v));
    }
    if (v === '') el.innerHTML = '';
    var atual = getPath(path);
    if ((atual == null ? '' : String(atual)) === v) return;
    setPath(path, v);
    salvar();
    if (el.closest('#print')) {
      render();
      // refaz a paginação quando o cursor sair das folhas (para não perder o campo em edição)
      setTimeout(function(){ var a = document.activeElement; if (!a || !a.closest || !a.closest('#print')) renderPrint(); }, 0);
    }
    else { renderPrint(); if (/^secoes\.\d+\.titulo$/.test(path)) atualizarNav(); }
  }
  function atualizarNav(){
    data.secoes.forEach(function(s){
      var a = document.querySelector('.nav-inner a[href="#' + s.id + '"]');
      if (a) a.textContent = s.titulo;
    });
  }

  function rerender(){
    var y = window.scrollY;
    render();
    renderPrint();
    window.scrollTo({ top: y, left: 0, behavior: 'instant' });
  }

  function lerImagem(file){
    return new Promise(function(res, rej){
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function(){
        var max = 900, s = Math.min(1, max / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        res(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('imagem inválida')); };
      img.src = url;
    });
  }

  function acao(nome, path, el){
    var ref, g, novo, nomeItem;
    switch (nome) {
      case 'add':
        g = getPath(path);
        novo = { nome: 'Novo item', desc: '' };
        if (Array.isArray(g.colunas) && g.colunas.length) novo.precos = g.colunas.map(function(){ return ''; });
        else novo.preco = '';
        if (g.comFoto) novo.foto = '';
        g.itens.push(novo);
        salvar(); rerender();
        var alvo = document.querySelector('[data-path="' + path + '.itens.' + (g.itens.length - 1) + '.nome"]');
        if (alvo) { alvo.focus(); document.execCommand && document.execCommand('selectAll', false, null); }
        break;
      case 'del':
        nomeItem = getPath(path + '.nome') || 'este item';
        if (!confirm('Excluir “' + nomeItem + '” do cardápio?\n\nDica: se for algo temporário, use “Ocultar (em falta)”.')) return;
        ref = pai(path); getPath(ref.lista).splice(ref.idx, 1);
        salvar(); rerender(); toast('Item excluído');
        break;
      case 'up': case 'down':
        ref = pai(path);
        var lista = getPath(ref.lista), j = ref.idx + (nome === 'up' ? -1 : 1);
        if (j < 0 || j >= lista.length) return;
        var tmp = lista[ref.idx]; lista[ref.idx] = lista[j]; lista[j] = tmp;
        salvar(); rerender();
        break;
      case 'ocultar':
        var it = getPath(path); it.oculto = !it.oculto; if (!it.oculto) delete it.oculto;
        salvar(); rerender(); toast(it.oculto ? 'Item oculto: não aparece para os clientes' : 'Item visível novamente');
        break;
      case 'ocultar-cat':
        var cat = getPath(path); cat.oculto = !cat.oculto; if (!cat.oculto) delete cat.oculto;
        salvar(); rerender();
        toast(cat.oculto ? '“' + (cat.titulo || 'Categoria') + '” oculta: não aparece para os clientes nem na impressão' : '“' + (cat.titulo || 'Categoria') + '” visível novamente', 3500);
        break;
      case 'del-cat':
        var c = getPath(path), ehSecao = /^secoes\.\d+$/.test(path);
        var qtd = ehSecao ? c.grupos.reduce(function(t, g){ return t + g.itens.length; }, 0) : c.itens.length;
        if (!confirm('Excluir ' + (ehSecao ? 'a seção' : 'a categoria') + ' “' + (c.titulo || 'sem título') + '” e ' +
          (qtd === 1 ? 'o 1 item dela' : 'os ' + qtd + ' itens dela') + '?\n\nDica: se for temporário, use “Ocultar” — dá para mostrar de novo depois.')) return;
        ref = pai(path); getPath(ref.lista).splice(ref.idx, 1);
        salvar(); rerender(); toast((ehSecao ? 'Seção' : 'Categoria') + ' excluída. Para desfazer, use “Descartar alterações”.', 4000);
        break;
      case 'add-cat':
        var secao = getPath(path);
        secao.grupos.push({ titulo: 'Nova categoria', itens: [{ nome: 'Novo item', desc: '', preco: '' }] });
        salvar(); rerender();
        var t = document.querySelector('#app [data-path="' + path + '.grupos.' + (secao.grupos.length - 1) + '.titulo"]');
        if (t) { t.focus(); document.execCommand && document.execCommand('selectAll', false, null); }
        break;
      case 'foto-up':
        alvoFoto = path;
        document.getElementById('input-foto').click();
        break;
      case 'foto-link':
        var url = prompt('Cole o link da imagem (https://...) ou o caminho do arquivo ao lado deste cardápio (ex.: fotos/burger-do-chef.jpg):', getPath(path) && String(getPath(path)).indexOf('data:') !== 0 ? getPath(path) : '');
        if (url == null) return;
        if (url.trim() !== getPath(path)) limparAjuste(path);
        setPath(path, url.trim()); salvar(); rerender();
        break;
      case 'foto-del':
        if (!confirm('Remover esta foto?')) return;
        setPath(path, ''); limparAjuste(path); salvar(); rerender();
        break;
      case 'foto-ajustar':
        abrirAjuste(path, el && el.closest ? el.closest('figure') : null);
        break;
    }
  }

  /* ---------- Editor de enquadramento: arrastar para posicionar, zoom por controle, roda ou pinça ---------- */
  function abrirAjuste(path, fig){
    var src = getPath(path);
    if (!src) return;
    var st = ajusteDe(path) || { x: 50, y: 50, z: 1 };
    if (!fig) fig = document.querySelector((document.body.classList.contains('modo-impressao') ? '#print' : '#app') + ' figure[data-path="' + path + '"]');
    var ratio = fig && fig.clientHeight ? fig.clientWidth / fig.clientHeight : 1;
    if (!isFinite(ratio) || ratio <= 0) ratio = 1;
    var maxW = Math.min(640, window.innerWidth - 68), maxH = Math.min(window.innerHeight * 0.55, 480);
    var w = maxW, h = w / ratio;
    if (h > maxH) { h = maxH; w = h * ratio; }
    w = Math.round(w); h = Math.round(h);

    var m = document.createElement('div');
    m.className = 'ajuste-modal efemero';
    m.innerHTML = '<div class="ajuste-caixa" role="dialog" aria-modal="true" aria-label="Ajustar enquadramento da foto">' +
      '<h3>Ajustar enquadramento</h3>' +
      '<p class="ajuste-dica">Arraste a foto para escolher a parte que aparece. Use o controle abaixo, a roda do mouse ou o gesto de pinça no celular para dar zoom. ' +
      'O mesmo enquadramento vale para o cardápio digital e a versão impressa (onde o espaço pode ter outro formato).</p>' +
      '<div class="ajuste-quadro" style="width:' + w + 'px;height:' + h + 'px"><img alt="" draggable="false"></div>' +
      '<div class="ajuste-zoom"><button type="button" data-a="menos" aria-label="Diminuir zoom">−</button>' +
      '<input type="range" min="1" max="4" step="0.01" aria-label="Zoom"><button type="button" data-a="mais" aria-label="Aumentar zoom">+</button><output></output></div>' +
      '<div class="ajuste-botoes"><button type="button" class="btn" data-a="reset">Centralizar / sem zoom</button><span class="espaco"></span>' +
      '<button type="button" class="btn" data-a="cancelar">Cancelar</button><button type="button" class="btn primario" data-a="salvar">Salvar enquadramento</button></div></div>';
    document.body.appendChild(m);

    var quadro = m.querySelector('.ajuste-quadro'), img = quadro.querySelector('img');
    var range = m.querySelector('input[type=range]'), out = m.querySelector('output');
    function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
    function aplicar(){
      img.style.cssText = cssAjuste(st);
      range.value = st.z;
      out.textContent = Math.round(st.z * 100) + '%';
    }
    function mover(dx, dy){
      var nw = img.naturalWidth || w, nh = img.naturalHeight || h;
      var c = Math.max(w / nw, h / nh);
      var px = (nw * c - w) * st.z + w * (st.z - 1);
      var py = (nh * c - h) * st.z + h * (st.z - 1);
      if (px > 0.5) st.x = clamp(st.x - dx / px * 100, 0, 100);
      if (py > 0.5) st.y = clamp(st.y - dy / py * 100, 0, 100);
      aplicar();
    }
    function zoom(z){ st.z = clamp(z, 1, 4); aplicar(); }
    img.onload = aplicar;
    img.src = src;
    aplicar();

    var ptrs = {}, distAnt = 0;
    function dist(){ var k = Object.keys(ptrs); if (k.length < 2) return 0; var a = ptrs[k[0]], b = ptrs[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }
    quadro.addEventListener('pointerdown', function(e){
      quadro.setPointerCapture(e.pointerId);
      ptrs[e.pointerId] = { x: e.clientX, y: e.clientY };
      distAnt = dist();
      quadro.classList.add('arrastando');
    });
    quadro.addEventListener('pointermove', function(e){
      var p = ptrs[e.pointerId];
      if (!p) return;
      var n = Object.keys(ptrs).length;
      var dx = e.clientX - p.x, dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;
      if (n === 1) mover(dx, dy);
      else { var d = dist(); if (distAnt > 0 && d > 0) zoom(st.z * d / distAnt); distAnt = d; }
    });
    function soltar(e){ delete ptrs[e.pointerId]; distAnt = dist(); if (!Object.keys(ptrs).length) quadro.classList.remove('arrastando'); }
    quadro.addEventListener('pointerup', soltar);
    quadro.addEventListener('pointercancel', soltar);
    quadro.addEventListener('wheel', function(e){ e.preventDefault(); zoom(st.z * Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
    range.addEventListener('input', function(){ zoom(+range.value); });

    function fechar(){ document.removeEventListener('keydown', teclas, true); m.remove(); }
    function salvarAjuste(){
      var a = { x: Math.round(st.x * 10) / 10, y: Math.round(st.y * 10) / 10, z: Math.round(st.z * 100) / 100 };
      if (a.z === 1 && a.x === 50 && a.y === 50) limparAjuste(path); else setPath(path + 'Ajuste', a);
      fechar(); salvar(); rerender(); toast('Enquadramento salvo');
    }
    function teclas(e){
      if (e.key === 'Escape') { e.preventDefault(); fechar(); }
      else if (e.key === 'Enter') { e.preventDefault(); salvarAjuste(); }
      else if (e.key === '+' || e.key === '=') zoom(st.z * 1.1);
      else if (e.key === '-') zoom(st.z / 1.1);
      else if (/^Arrow/.test(e.key) && e.target !== range) {
        e.preventDefault();
        var k = { ArrowLeft: [8, 0], ArrowRight: [-8, 0], ArrowUp: [0, 8], ArrowDown: [0, -8] }[e.key];
        mover(k[0], k[1]);
      }
    }
    document.addEventListener('keydown', teclas, true);
    m.addEventListener('click', function(e){
      if (e.target === m) { fechar(); return; }
      var b = e.target.closest('[data-a]');
      if (!b) return;
      var a = b.dataset.a;
      if (a === 'mais') zoom(st.z * 1.15);
      else if (a === 'menos') zoom(st.z / 1.15);
      else if (a === 'reset') { st = { x: 50, y: 50, z: 1 }; aplicar(); }
      else if (a === 'cancelar') fechar();
      else if (a === 'salvar') salvarAjuste();
    });
    m.querySelector('[data-a="salvar"]').focus();
  }

  function exportarHTML(){
    var doc = document.documentElement.cloneNode(true);
    doc.querySelector('#app').innerHTML = '';
    doc.querySelector('body').removeAttribute('class');
    doc.querySelectorAll('.efemero').forEach(function(n){ n.parentNode.removeChild(n); });
    var limpo = clonar(data);
    doc.querySelector('#dados-cardapio').textContent = '\n' + JSON.stringify(limpo, null, 2).replace(/</g, '\\u003c') + '\n';
    var html = '<!DOCTYPE html>\n' + doc.outerHTML;
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'cardapio.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    toast('Arquivo baixado. Substitua o cardapio.html publicado por ele.', 4500);
  }

  function iniciarEdicao(){
    document.body.classList.add('modo-edicao');

    var ajuda = document.createElement('div');
    ajuda.className = 'ajuda efemero';
    ajuda.innerHTML = '<div class="ajuda-box"><strong>Modo edição do cardápio</strong>' +
      '<ol><li>Clique em qualquer nome, descrição ou preço para alterar (no preço, digite só o número, ex.: 32 ou 32,50).</li>' +
      '<li>Use os botões de cada item para mover, ocultar quando estiver em falta, excluir ou incluir foto. Clique nos espaços tracejados para enviar fotos e clique numa foto para ajustar o zoom e o enquadramento.</li>' +
      '<li>Tudo fica salvo neste navegador. Para publicar, clique em <strong>Baixar cardápio atualizado</strong> e substitua o arquivo do site.</li></ol></div>';
    document.body.insertBefore(ajuda, document.getElementById('app'));

    var barra = document.createElement('div');
    barra.className = 'barra efemero';
    barra.setAttribute('role', 'toolbar');
    barra.innerHTML = '<div class="barra-inner">' +
      '<div class="barra-info"><strong>Modo edição</strong><span id="status"></span></div>' +
      '<label><input type="checkbox" id="opt-vazios"' + (data.config.mostrarEspacosFoto ? ' checked' : '') + '> Mostrar espaços de foto vazios aos clientes</label>' +
      '<button type="button" class="btn" id="btn-preview">Pré-visualizar</button>' +
      '<button type="button" class="btn" id="btn-versao-impressa">Versão para impressão</button>' +
      '<button type="button" class="btn primario" id="btn-baixar">Baixar cardápio atualizado</button>' +
      '<button type="button" class="btn" id="btn-descartar">Descartar alterações</button>' +
      '<button type="button" class="btn" id="btn-sair">Sair</button></div>';
    document.body.appendChild(barra);

    var t = document.createElement('div'); t.id = 'toast'; t.className = 'toast efemero'; t.setAttribute('role', 'status');
    document.body.appendChild(t);

    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.id = 'input-foto'; inp.className = 'efemero'; inp.hidden = true;
    document.body.appendChild(inp);
    inp.addEventListener('change', function(){
      var f = inp.files && inp.files[0]; inp.value = '';
      if (!f || !alvoFoto) return;
      var p = alvoFoto;
      lerImagem(f).then(function(src){
        setPath(p, src); limparAjuste(p); salvar(); rerender();
        toast('Foto adicionada. Para ajustar o zoom, clique nela.', 3500);
      })
        .catch(function(){ toast('Não foi possível ler essa imagem.'); });
    });

    var app = document;
    app.addEventListener('focusout', function(e){ if (e.target.classList && e.target.classList.contains('ed')) commit(e.target); });
    app.addEventListener('keydown', function(e){
      var el = e.target;
      if (!el.classList || !el.classList.contains('ed')) return;
      if (e.key === 'Enter' && (el.dataset.tipo !== 'multi' || e.ctrlKey || e.metaKey)) { e.preventDefault(); el.blur(); }
      if (e.key === 'Escape') { el.textContent = el.dataset.tipo === 'preco' ? fmtPreco(getPath(el.dataset.path)) : (getPath(el.dataset.path) || ''); el.blur(); }
    });
    app.addEventListener('paste', function(e){
      if (!e.target.closest || !e.target.closest('.ed')) return;
      e.preventDefault();
      var txt = (e.clipboardData || window.clipboardData).getData('text');
      document.execCommand('insertText', false, txt);
    });
    app.addEventListener('click', function(e){
      if (!e.target.closest || !e.target.closest('#app, #print')) return;
      if (e.target.closest('.ed') && e.target.closest('a')) e.preventDefault();
      if (document.body.classList.contains('preview')) return;
      var b = e.target.closest('[data-acao]');
      if (!b || b.tagName === 'INPUT') return;
      e.preventDefault();
      acao(b.dataset.acao, b.dataset.path, b);
    });
    app.addEventListener('change', function(e){
      var el = e.target;
      if (el.dataset && el.dataset.acao === 'fotos-grupo') {
        var g = getPath(el.dataset.path);
        g.comFoto = el.checked;
        if (!g.comFoto) delete g.comFoto;
        salvar(); rerender();
      }
    });

    document.getElementById('opt-vazios').addEventListener('change', function(e){
      data.config.mostrarEspacosFoto = e.target.checked; salvar(); rerender();
    });
    document.getElementById('btn-preview').addEventListener('click', function(e){
      var on = document.body.classList.toggle('preview');
      e.target.textContent = on ? 'Voltar a editar' : 'Pré-visualizar';
      document.querySelectorAll('#app .ed').forEach(function(el){ el.contentEditable = on ? 'false' : 'true'; });
      document.querySelectorAll('#app .foto.vazia').forEach(function(f){ f.style.display = on && !data.config.mostrarEspacosFoto ? 'none' : ''; });
    });
    document.getElementById('btn-baixar').addEventListener('click', exportarHTML);
    document.getElementById('btn-versao-impressa').addEventListener('click', function(){
      modoImpressao(!document.body.classList.contains('modo-impressao'));
    });
    document.getElementById('btn-descartar').addEventListener('click', function(){
      if (!confirm('Descartar todas as alterações feitas neste navegador e voltar ao cardápio publicado?')) return;
      try { localStorage.removeItem(LS_KEY); } catch(e){}
      data = clonar(ORIGINAL); data.config = data.config || { mostrarEspacosFoto: true };
      var st = document.getElementById('sel-tema'); if (st) st.value = data.config.temaImpressao === 'claro' ? 'claro' : 'escuro';
      var sl = document.getElementById('sel-letra'); if (sl) sl.value = LETRAS[data.config.letraImpressao] ? data.config.letraImpressao : 'grande';
      document.getElementById('opt-vazios').checked = !!data.config.mostrarEspacosFoto;
      salvar(); rerender(); toast('Alterações descartadas');
    });
    document.getElementById('btn-sair').addEventListener('click', function(){
      if (JSON.stringify(data) !== JSON.stringify(ORIGINAL) &&
          !confirm('As alterações continuam salvas neste navegador, mas só aparecem para os clientes depois de baixar e publicar o arquivo. Sair do modo edição?')) return;
      location.href = location.pathname;
    });
  }

  /* ---------- Início ---------- */
  render();
  renderPrint();
  iniciarImpressao();
  if (editando) { iniciarEdicao(); salvar(); }
  if (/[?&]imprimir\b/.test(location.search) || location.hash === '#imprimir') modoImpressao(true);
})();
</script>
